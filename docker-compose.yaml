services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile 
    container_name: kiwi
    env_file:
      - .env
    depends_on:
      ollama:
        condition: service_healthy 
      neo4j:
        condition: service_healthy 
    ports: 
      - "8050:8050"
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "7869:11434"
    volumes:
      - ollama:/root/.ollama
      - ./ollama/entrypoint.sh:/root/ollama/entrypoint.sh
    container_name: ollama
    pull_policy: always
    tty: true
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    entrypoint: ["/usr/bin/bash", "/root/ollama/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "ollama", "show", "llama3.2:1b"]
      interval: 60s
      start_period: 180s

  neo4j:
    build:
      context: ./neo4j
      dockerfile: Dockerfile
    container_name: neo4j
    ports:
      - "7474:7474"  # Neo4j Browser (HTTP)
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j-data:/root/neo4j/data
      - neo4j-plugins:/root/neo4j/plugins
      - ./neo4j/init/movies.cypher:/import/movies.cypher
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PWD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*

    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"] 
      interval: 1s
      timeout: 10s
      retries: 20
      start_period: 3s

volumes:
  ollama: {}
  neo4j-data: {}
  neo4j-plugins: {}